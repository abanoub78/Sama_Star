<h2 class="page-title">🚌 Buses</h2>

<!-- ================= Add Bus Form ================= -->
<div class="add-form">
  <input type="text" placeholder="Bus Number" [(ngModel)]="newBus.bus_number" />

  <select [(ngModel)]="newBus.bus_type" class="bustype">
    <option [ngValue]="null" disabled>Select Type</option>
    <option value="VIP">VIP</option>
    <option value="Economy">Economy</option>
  </select>

  <input type="number" placeholder="Total Seats" [(ngModel)]="newBus.total_seats" />

  <button mat-raised-button color="primary" (click)="addBus()">Add Bus</button>
</div>

<!-- ================= Buses Table ================= -->
<div class="table-wrapper">
  <table mat-table [dataSource]="buses" class="mat-elevation-z8 buses-table">
    <!-- ===== Bus Number ===== -->
    <ng-container matColumnDef="bus_number">
      <th mat-header-cell *matHeaderCellDef>Bus Number</th>
      <td mat-cell *matCellDef="let bus">
        <!-- View -->
        <ng-container *ngIf="editingBus?.id !== bus.id; else editNumber">
          {{ bus.bus_number }}
        </ng-container>

        <!-- Edit -->
        <ng-template #editNumber>
          <input [(ngModel)]="editingBus!.bus_number" />
        </ng-template>
      </td>
    </ng-container>

    <!-- ===== Bus Type ===== -->
    <ng-container matColumnDef="bus_type">
      <th mat-header-cell *matHeaderCellDef>Bus Type</th>
      <td mat-cell *matCellDef="let bus" class="bus-type-cell">
        <!-- View mode -->
        <ng-container *ngIf="editingBus?.id !== bus.id; else editType">
          <span
            class="bus-type-badge"
            [ngClass]="{
              vip: bus.bus_type === 'VIP',
              economy: bus.bus_type === 'Economy'
            }"
          >
            {{ bus.bus_type }}
          </span>
        </ng-container>

        <!-- Edit mode -->
        <ng-template #editType>
          <mat-form-field appearance="outline" class="bus-type-field">
            <mat-select [(ngModel)]="editingBus!.bus_type">
              <mat-option value="VIP">VIP</mat-option>
              <mat-option value="Economy">Economy</mat-option>
            </mat-select>
          </mat-form-field>
        </ng-template>
      </td>
    </ng-container>

    <!-- ===== Total Seats ===== -->
    <ng-container matColumnDef="total_seats">
      <th mat-header-cell *matHeaderCellDef>Total Seats</th>
      <td mat-cell *matCellDef="let bus">
        <!-- View -->
        <ng-container *ngIf="editingBus?.id !== bus.id; else editSeats">
          {{ bus.total_seats }}
        </ng-container>

        <!-- Edit -->
        <ng-template #editSeats>
          <input type="number" [(ngModel)]="editingBus!.total_seats" />
        </ng-template>
      </td>
    </ng-container>

    <!-- ===== Actions ===== -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let bus">
        <!-- Normal Mode -->
        <ng-container *ngIf="editingBus?.id !== bus.id">
          <button mat-stroked-button color="primary" (click)="startEdit(bus)">Edit</button>

          <button mat-stroked-button color="warn" (click)="deleteBus(bus.id)">Delete</button>
        </ng-container>

        <!-- Edit Mode -->
        <ng-container *ngIf="editingBus?.id === bus.id">
          <button mat-stroked-button color="accent" (click)="saveEdit()">Save</button>

          <button mat-stroked-button (click)="cancelEdit()">Cancel</button>
        </ng-container>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-row"></tr>
  </table>
</div>

<!-- ================= Empty State ================= -->
<p *ngIf="!buses.length" class="empty-state">No buses added yet 🚌</p>
