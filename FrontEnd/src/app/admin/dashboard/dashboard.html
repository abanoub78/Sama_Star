<!-- STAT CARDS -->
<div class="stats-grid">
  <div class="stat-card blue">
    <span class="icon">🚌</span>
    <div>
      <h4>Buses</h4>
      <p>{{ stats.buses }}</p>
    </div>
  </div>

  <div class="stat-card green">
    <span class="icon">🗺</span>
    <div>
      <h4>Trips</h4>
      <p>{{ stats.trips }}</p>
    </div>
  </div>

  <div class="stat-card orange">
    <span class="icon">👨‍✈️</span>
    <div>
      <h4>Drivers</h4>
      <p>{{ stats.drivers }}</p>
    </div>
  </div>

  <div class="stat-card red">
    <span class="icon">🎟</span>
    <div>
      <h4>Bookings</h4>
      <p>{{ stats.bookings }}</p>
    </div>
  </div>
</div>

<!-- CHARTS -->
<div class="charts-grid">
  <div class="chart-card">
    <h3>Overall Statistics</h3>
    <canvas baseChart [data]="barChartData" [options]="barChartOptions" chartType="bar"> </canvas>
  </div>

  <!-- <div class="chart-card">
    <h3>Distribution</h3>
    <canvas baseChart [data]="doughnutChartData" chartType="doughnut"> </canvas>
  </div> -->

  <div class="chart-card full">
    <h3>Growth Overview</h3>
    <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" chartType="line">
    </canvas>
  </div>
</div>
